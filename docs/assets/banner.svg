<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="DocMind - AI document Q&amp;A with RAG">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060912"/><stop offset="1" stop-color="#141b30"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"><animate attributeName="stop-color" values="#3b82f6;#8b5cf6;#22d3ee;#3b82f6" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#3b82f6;#8b5cf6;#22d3ee" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#3b82f6" stop-opacity=".55"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <clipPath id="type"><rect x="250" y="168" height="30" width="0">
      <animate attributeName="width" values="0;520;520;0" keyTimes="0;.45;.9;1" dur="9s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>
  <rect width="1000" height="260" rx="22" fill="url(#bg)"/>
  <circle r="140" fill="url(#glow)"><animate attributeName="cx" values="150;420;150" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="60;200;60" dur="12s" repeatCount="indefinite"/></circle>
  <circle r="120" fill="url(#glow)" opacity=".7"><animate attributeName="cx" values="880;600;880" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="200;40;200" dur="14s" repeatCount="indefinite"/></circle>
  <g fill="#60a5fa">
    <circle cx="80" cy="40" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="70" r="2"><animate attributeName="opacity" values="1;.1;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="230" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="225" r="2"><animate attributeName="opacity" values="1;.1;1" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(250 52)">
    <rect width="64" height="64" rx="16" fill="#2563eb"/>
    <path d="M16 20h13c2 0 3 1 3 3v22c0-2-1-3-3-3H16zM48 20H35c-2 0-3 1-3 3v22c0-2 1-3 3-3h13z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0 200;200 0" dur="1.6s" fill="freeze"/>
    </path>
    <circle cx="58" cy="58" r="6" fill="#10b981" stroke="#060912" stroke-width="3"><animate attributeName="r" values="6;7.5;6" dur="2s" repeatCount="indefinite"/></circle>
  </g>
  <text x="336" y="104" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="58" font-weight="800" fill="url(#title)">DocMind</text>
  <g clip-path="url(#type)"><text x="250" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" fill="#cbd5e1">Chat with your documents. Grounded answers.</text></g>
  <rect x="772" y="170" width="2" height="24" fill="#60a5fa"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  <text x="250" y="226" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#64748b" letter-spacing="2">SPRING AI  •  PGVECTOR  •  OPENAI  •  REACT 19</text>
</svg>
